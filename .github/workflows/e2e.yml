name: End-to-end Tests
on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: ../docker-compose.yml:../docker-compose.e2e.yml
    defaults:
      run:
        working-directory: ./website
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: lts/*
    - name: Cache .npm
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('lapis-e2e/**/package-lock.json') }}
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Docker metadata
      id: dockerMetadata
      uses: docker/metadata-action@v6.2.0
      with:
        images: "dummyImageName"
        tags: |
          type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
    - name: Get Branch Tag
      id: branchTag
      env:
        TAG: ${{ steps.dockerMetadata.outputs.tags }}
      run: echo "branchTag=${TAG##*:}" >> $GITHUB_OUTPUT

    - name: Wait for website Docker image
      uses: lewagon/wait-on-check-action@v1.9.0
      with:
        ref: ${{ github.sha }}
        check-name: Build Website Docker Image
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 10
    - name: Wait for backend Docker image
      uses: lewagon/wait-on-check-action@v1.9.0
      with:
        ref: ${{ github.sha }}
        check-name: Build Backend Docker Image
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 5

    - name: Prepare test dashboard configuration
      run: node tests/prepareConfig.ts

    - name: Start Docker Containers
      run: docker compose up -d --wait website backend database
      env:
        WEBSITE_TAG: ${{ steps.branchTag.outputs.branchTag }}
        BACKEND_TAG: ${{ steps.branchTag.outputs.branchTag }}
        SEEDER_TAG: ${{ steps.branchTag.outputs.branchTag }}

    - name: Seed example data (wait for completion before running tests)
      # Run the seeder as a one-shot job and block until it finishes.
      # Avoids race conditions with the tests that also create collections.
      run: docker compose run --rm --no-deps example-data-seeder
      env:
        WEBSITE_TAG: ${{ steps.branchTag.outputs.branchTag }}
        BACKEND_TAG: ${{ steps.branchTag.outputs.branchTag }}
        SEEDER_TAG: ${{ steps.branchTag.outputs.branchTag }}

    - name: Run Playwright tests (all browsers)
      if: github.ref == 'refs/heads/main'
      run: npm run e2e
      env:
        BACKEND_URL: http://localhost:9021

    - name: Run Playwright tests (chromium only)
      if: github.ref != 'refs/heads/main'
      run: npm run e2e:chromium
      env:
        BACKEND_URL: http://localhost:9021

    - name: Collect container logs
      if: ${{ always() && !cancelled() }}
      run: |
        mkdir -p /tmp/container-logs
        services="$(docker compose config --services || true)"
        for service in $services; do
          docker compose logs --no-color "$service" > "/tmp/container-logs/${service}.log" || true
        done

    - name: Upload container logs
      uses: actions/upload-artifact@v7
      if: ${{ always() && !cancelled() }}
      with:
        name: container-logs
        path: /tmp/container-logs/
        retention-days: 7

    - name: Upload Playwright report
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: website/playwright-report/
        retention-days: 30
